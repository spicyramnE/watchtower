services:
  postgres:
    image: postgres:17
    container_name: watchtower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watchtower
      POSTGRES_USER: watchtower_user
      POSTGRES_PASSWORD: watchtower_dev_password
    ports:
      - "5432:5432"
    volumes:
      - watchtower_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: watchtower-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - watchtower_redis_data:/data

volumes:
  watchtower_pg_data:
  watchtower_redis_data:
