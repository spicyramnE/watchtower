name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  GCP_REGION: us-central1
  SERVICE_NAME: watchtower

jobs:
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: watchtower
          POSTGRES_USER: watchtower_user
          POSTGRES_PASSWORD: watchtower_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U watchtower_user -d watchtower"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw verify -B
        env:
          TZ: UTC

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend-build:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # The `secrets` context can't be used in an `if:` condition, so whether GCP
  # is configured has to be resolved into a job output that later jobs CAN
  # gate on. Gating at job level (rather than per-step) means the deploy job
  # reports as genuinely skipped instead of green-but-empty.
  check-gcp-config:
    name: Check GCP configuration
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GCP configured - image push and Cloud Run deploy will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GCP secrets not set - building the image to validate the Dockerfile, but skipping push and deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    name: Build & push Docker image
    needs: [check-gcp-config]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Built unconditionally: proves the Dockerfile is valid on every push,
      # even when there's nowhere to push it to.
      - name: Build image
        run: docker build -t watchtower:${{ github.sha }} .

      - id: auth
        if: needs.check-gcp-config.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        if: needs.check-gcp-config.outputs.configured == 'true'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Tag & push to Artifact Registry
        if: needs.check-gcp-config.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchtower/watchtower
        run: |
          docker tag watchtower:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag watchtower:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Cloud Run
    needs: [check-gcp-config, docker-build]
    runs-on: ubuntu-latest
    if: needs.check-gcp-config.outputs.configured == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/watchtower/watchtower:${{ github.sha }}
          env_vars: |
            SPRING_PROFILES_ACTIVE=prod
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            DATABASE_USER=DATABASE_USER:latest
            DATABASE_PASSWORD=DATABASE_PASSWORD:latest
            VOYAGE_API_KEY=VOYAGE_API_KEY:latest
            GROQ_API_KEY=GROQ_API_KEY:latest
            JWT_SECRET=JWT_SECRET:latest
