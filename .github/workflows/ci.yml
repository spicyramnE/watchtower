name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  RESOURCE_GROUP: watchtower-rg
  CONTAINER_APP_NAME: watchtower
  ACR_LOGIN_SERVER: watchtoweracr.azurecr.io

jobs:
  backend-test:
    name: Backend build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: watchtower
          POSTGRES_USER: watchtower_user
          POSTGRES_PASSWORD: watchtower_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U watchtower_user -d watchtower"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw verify -B
        env:
          TZ: UTC

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend-build:
    name: Frontend build & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # The `secrets` context can't be used in an `if:` condition, so whether
  # Azure is configured has to be resolved into a job output that later jobs
  # CAN gate on. Gating at job level (rather than per-step) means the deploy
  # job reports as genuinely skipped instead of green-but-empty.
  check-azure-config:
    name: Check Azure configuration
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      configured: ${{ steps.check.outputs.configured }}

    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Azure configured - image push and Container Apps deploy will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Azure secrets not set - building the image to validate the Dockerfile, but skipping push and deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  docker-build:
    name: Build & push Docker image
    needs: [check-azure-config]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Built unconditionally: proves the Dockerfile is valid on every push,
      # even when there's nowhere to push it to.
      - name: Build image
        run: docker build -t watchtower:${{ github.sha }} .

      - uses: azure/login@v2
        if: needs.check-azure-config.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: needs.check-azure-config.outputs.configured == 'true'
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Tag & push to Azure Container Registry
        if: needs.check-azure-config.outputs.configured == 'true'
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/watchtower
        run: |
          docker tag watchtower:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag watchtower:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Azure Container Apps
    needs: [check-azure-config, docker-build]
    runs-on: ubuntu-latest
    if: needs.check-azure-config.outputs.configured == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App secrets (DATABASE_URL, GROQ_API_KEY, etc.) live on the Container
      # App itself, set once during initial provisioning - they persist
      # across revisions, so CI only ever points the app at a new image, it
      # never re-supplies secret values.
      - name: Point Container App at the new image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/watchtower:${{ github.sha }}
