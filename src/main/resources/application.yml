spring:
  application:
    name: watchtower
  datasource:
    url: jdbc:postgresql://localhost:5432/watchtower
    username: watchtower_user
    password: watchtower_dev_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    mcp:
      server:
        name: watchtower-mcp-server
        version: 0.1.0
        type: SYNC

server:
  port: 8080
