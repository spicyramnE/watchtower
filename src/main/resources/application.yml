spring:
  application:
    name: watchtower
  datasource:
    url: jdbc:postgresql://localhost:5432/watchtower
    username: watchtower_user
    password: watchtower_dev_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    mcp:
      server:
        name: watchtower-mcp-server
        version: 0.1.0
        type: SYNC

voyage:
  api-key: ${VOYAGE_API_KEY:}
  base-url: https://api.voyageai.com/v1
  model: voyage-3.5-lite

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b

server:
  port: 8080
